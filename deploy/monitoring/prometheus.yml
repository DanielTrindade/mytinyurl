global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas do próprio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas do sistema operacional (CPU, memória, disco, rede)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Métricas dos containers Docker
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
