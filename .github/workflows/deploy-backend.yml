name: Deploy Backend → VPS (GHCR + Docker Swarm)

# Dispara apenas quando há mudanças no backend ou neste workflow
on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'bun.lock'
      - 'deploy/swarm/**'
      - 'scripts/deploy-swarm.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_full: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem (tag = short SHA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Configurar Docker Buildx (build multi-plataforma e cache)
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem do backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre builds para acelerar o CI
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # PORT opcional, padrão 22
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            cd /opt/mytinyurl

            # Atualiza o repositório
            git fetch origin main
            git reset --hard origin/main

            # Faz login no GHCR para poder fazer pull da imagem
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Define a imagem exata gerada neste build
            export BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"

            # Roda o deploy passando a imagem pré-construída
            # O script não precisa mais fazer docker build na VPS
            BACKEND_IMAGE="${BACKEND_IMAGE}" \
              ./scripts/deploy-swarm.sh deploy/swarm/.env.production

            # Limpa imagens antigas para liberar disco (mantém as 3 últimas)
            docker image prune -f --filter "until=72h"

      - name: Notifica resultado
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            echo "✅ Deploy concluído com sucesso — ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
          else
            echo "❌ Deploy falhou — verifique os logs acima"
          fi
